name: Build and release

# Push a tag like v1.3 and this builds the Windows installer and attaches it
# to the release, so the in-app updater has something to find.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-server.txt -r requirements-dev.txt pyinstaller

      - name: Run the tests that need no display
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python tests/make_fixture.py
          python tests/test_pipeline.py
          python tests/test_camera.py
          python tests/test_service.py
          python tests/test_updater.py
          python tests/test_parts.py

      - name: Build the app
        run: |
          python tools/make_icon.py
          python -m PyInstaller packaging/scoreshift.spec --noconfirm --clean

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}","$env:ProgramFiles" -Filter ISCC.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          & $iscc packaging\installer.iss

      - name: Checksums
        run: |
          $setup = Get-ChildItem dist\ScoreShift-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      # The in-app updater shows these notes, so give it the changelog entry
      # for this version rather than a bare list of commits.
      - name: Release notes from the changelog
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $next  = ($lines | Select-String -Pattern '^## ' | Select-Object -Skip 1 -First 1).LineNumber
          if (-not $next) { $next = $lines.Count + 1 }
          $body = $lines[$start..($next - 2)] -join "`n"
          if (-not $body.Trim()) { $body = "See the changelog." }
          Set-Content -Path release-notes.md -Value $body.Trim()
          Get-Content release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ScoreShift-Setup-*.exe
            dist/SHA256SUMS.txt
          body_path: release-notes.md
          append_body: true
          generate_release_notes: true
